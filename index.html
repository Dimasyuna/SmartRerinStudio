<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Verifikasi Usia & Manajemen Akses</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-color: #3b82f6;
      --accent-hover: #2563eb;
      --danger-color: #ef4444;
      --border-color: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background-color: var(--card-bg);
      border-radius: 12px;
      border: 1px solid var(--border-color);
      width: 100%;
      max-width: 450px;
      padding: 30px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    h1, h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    p {
      color: var(--text-muted);
      text-align: center;
      margin-bottom: 25px;
      font-size: 0.95rem;
      line-height: 1.5;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .date-inputs {
      display: flex;
      gap: 10px;
    }

    select {
      flex: 1;
      background-color: var(--bg-color);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 10px;
      border-radius: 6px;
      outline: none;
      font-size: 0.95rem;
    }

    select:focus {
      border-color: var(--accent-color);
    }

    button {
      width: 100%;
      background-color: var(--accent-color);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: var(--accent-hover);
    }

    .danger-btn {
      background-color: var(--danger-color);
    }

    .danger-btn:hover {
      background-color: #dc2626;
    }

    .hidden {
      display: none;
    }

    .content-box {
      border-top: 1px solid var(--border-color);
      padding-top: 20px;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Form Verifikasi Usia Standar -->
    <div id="age-verification-form">
      <h1>Verifikasi Usia</h1>
      <p>Silakan masukkan tanggal lahir Anda untuk mengakses situs ini.</p>
      
      <div class="form-group">
        <label>Tanggal Lahir</label>
        <div class="date-inputs">
          <select id="birth-day">
            <option value="">Hari</option>
          </select>
          <select id="birth-month">
            <option value="">Bulan</option>
            <option value="1">Januari</option>
            <option value="2">Februari</option>
            <option value="3">Maret</option>
            <option value="4">April</option>
            <option value="5">Mei</option>
            <option value="6">Juni</option>
            <option value="7">Juli</option>
            <option value="8">Agustus</option>
            <option value="9">September</option>
            <option value="10">Oktober</option>
            <option value="11">November</option>
            <option value="12">Desember</option>
          </select>
          <select id="birth-year">
            <option value="">Tahun</option>
          </select>
        </div>
      </div>

      <button id="submit-age">Masuk</button>
    </div>

    <!-- Halaman Konten Utama -->
    <div id="main-content" class="hidden">
      <h1>Selamat Datang!</h1>
      <p>Anda telah berhasil memverifikasi usia Anda.</p>

      <div class="content-box">
        <h2>Akses Khusus (NSFW 18+)</h2>
        <p>Konten ini membutuhkan verifikasi usia tambahan khusus (18+).</p>
        
        <div id="nsfw-form">
          <div class="form-group">
            <label>Konfirmasi Tanggal Lahir (18+)</label>
            <div class="date-inputs">
              <select id="nsfw-day">
                <option value="">Hari</option>
              </select>
              <select id="nsfw-month">
                <option value="">Bulan</option>
                <option value="1">Januari</option>
                <option value="2">Februari</option>
                <option value="3">Maret</option>
                <option value="4">April</option>
                <option value="5">Mei</option>
                <option value="6">Juni</option>
                <option value="7">Juli</option>
                <option value="8">Agustus</option>
                <option value="9">September</option>
                <option value="10">Oktober</option>
                <option value="11">November</option>
                <option value="12">Desember</option>
              </select>
              <select id="nsfw-year">
                <option value="">Tahun</option>
              </select>
            </div>
          </div>
          <button id="submit-nsfw" class="danger-btn">Buka Akses NSFW</button>
        </div>

        <div id="nsfw-content" class="hidden">
          <p style="color: #ef4444; font-weight: bold;">[ Konten NSFW 18+ Berhasil Diberikan ]</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Fungsi untuk mengisi opsi Hari (1-31)
    function populateDays(selectId) {
      const select = document.getElementById(selectId);
      if (!select) return;
      for (let day = 1; day <= 31; day++) {
        const option = document.createElement('option');
        option.value = day;
        option.textContent = day;
        select.appendChild(option);
      }
    }

    // Fungsi untuk mengisi opsi Tahun secara otomatis
    function populateYears(selectId) {
      const select = document.getElementById(selectId);
      if (!select) return;
      
      const currentYear = new Date().getFullYear();
      const startYear = 1940;
      
      for (let year = currentYear; year >= startYear; year--) {
        const option = document.createElement('option');
        option.value = year;
        option.textContent = year;
        select.appendChild(option);
      }
    }

    // Fungsi untuk menghitung usia
    function calculateAge(day, month, year) {
      const today = new Date();
      const birthDate = new Date(year, month - 1, day);
      let age = today.getFullYear() - birthDate.getFullYear();
      const monthDiff = today.getMonth() - birthDate.getMonth();
      
      if (monthDiff < 0 || (monthDiff === 0 && today.getDate() < birthDate.getDate())) {
        age--;
      }
      return age;
    }

    // Inisialisasi Opsi Form saat DOM selesai dimuat
    document.addEventListener('DOMContentLoaded', () => {
      // Isi dropdown Hari
      populateDays('birth-day');
      populateDays('nsfw-day');

      // Isi dropdown Tahun
      populateYears('birth-year');
      populateYears('nsfw-year');

      // Handling Submit Form Usia Standar
      document.getElementById('submit-age').addEventListener('click', () => {
        const day = document.getElementById('birth-day').value;
        const month = document.getElementById('birth-month').value;
        const year = document.getElementById('birth-year').value;

        if (!day || !month || !year) {
          alert('Silakan pilih tanggal, bulan, dan tahun lahir!');
          return;
        }

        const age = calculateAge(day, month, year);

        if (age >= 13) {
          document.getElementById('age-verification-form').classList.add('hidden');
          document.getElementById('main-content').classList.remove('hidden');
        } else {
          alert('Maaf, Anda harus berusia minimal 13 tahun untuk mengakses situs ini.');
        }
      });

      // Handling Submit Form NSFW (18+)
      document.getElementById('submit-nsfw').addEventListener('click', () => {
        const day = document.getElementById('nsfw-day').value;
        const month = document.getElementById('nsfw-month').value;
        const year = document.getElementById('nsfw-year').value;

        if (!day || !month || !year) {
          alert('Silakan pilih tanggal, bulan, dan tahun lahir untuk konfirmasi!');
          return;
        }

        const age = calculateAge(day, month, year);

        if (age >= 18) {
          document.getElementById('nsfw-form').classList.add('hidden');
          document.getElementById('nsfw-content').classList.remove('hidden');
        } else {
          alert('Maaf, Anda harus berusia minimal 18 tahun untuk membuka konten ini.');
        }
      });
    });
  </script>
</body>
</html>
